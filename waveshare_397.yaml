esphome:
  name: esphome-web-1234
  friendly_name: Waveshare-S3-ePaper-3.97
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: arduino    

time:
  - platform: sntp
    id: the_time

# Enable logging
logger:
  level: VERBOSE

i2c:
  sda: GPIO41
  scl: GPIO42
  scan: false
  frequency: 100kHz
  id: "i2c_a"

# Sensor configuration
sensor:
  - platform: bb_temp
    id: bb_temp1
    update_interval: 60s
    temperature:
      name: "internal temperature"
      id: t_sensor
    humidity:
      name: "internal humidity"
      id: h_sensor

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
# ota:
#  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Example configuration entry
font:
  - file: "Roboto-Black.ttf"
    id: small
    size: 48

  - file: "Roboto-Black.ttf"
    id: medium
    size: 70

  - file: "Roboto-Black.ttf"
    id: large
    size: 100

display:
  - platform: bb_epaper_iot
    update_interval: 60s
    id: waveshare_esp32s3
    model: waveshare_397
    refresh: partial
    lambda: |-
       it.fill(id(Color::BLACK));
       it.print(0, 0, id(medium), "ESPHome");
       it.print(0, 80, id(medium), "bb_epaper test");
       it.strftime(0, 160, id(medium), "Time: %H:%M", id(the_time).now());
       it.printf(0, 260, id(large), "T: %.1f °C", id(t_sensor).state);
       it.printf(0, 360, id(large), "H: %.1f %%", id(h_sensor).state);
