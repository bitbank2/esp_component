esphome:
  name: esphome-web-1234
  friendly_name: Waveshare-S3-ePaper-1.54
  min_version: 2024.11.0
  name_add_mac_suffix: false
  on_boot:
    then:
      - output.turn_on: vbat_power_enable # "connect" battery
      - output.turn_on: epd_power_enable # turn ePaper display on

esp32:
  variant: esp32s3
  framework:
    type: arduino    

i2c:
  sda: GPIO47
  scl: GPIO48
  scan: false
  frequency: 100kHz
  id: "i2c_a"

# Enable logging
logger:
  level: VERBOSE

# Sensor configuration
sensor:
  - platform: bb_temp
    id: bb_temp1
    update_interval: 15s
    temperature:
      name: "internal temperature"
      id: t_sensor
    humidity:
      name: "internal humidity"
      id: h_sensor

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
# ota:
#  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Example configuration entry
font:
  - file: "Roboto-Black.ttf"
    id: small
    size: 16

  - file: "Roboto-Black.ttf"
    id: medium
    size: 30

  - file: "Roboto-Black.ttf"
    id: large
    size: 40

output:
  - platform: gpio
    pin: GPIO6 # EPD3V3_EN pin GHF: Required by the ePaper display!!!
    id: epd_power_enable
    inverted: True

  - platform: gpio
    pin: 
      number: GPIO17 # BATT_Control pin GHF: Required by the battery to work!!!
      #allow_other_uses: True # GHF: Required here cause it is used in deep sleep as wakeup pin
    id: vbat_power_enable
    
  - platform: gpio
    pin: GPIO3
    id: green_led_pin
    inverted: True

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO13

display:
  - platform: bb_epaper
    update_interval: 30s
    id: waveshare_esp32s3
    cs_pin: GPIO11
    dc_pin: GPIO10
    busy_pin: GPIO8
    reset_pin: GPIO9
    model: ep154_200x200
    lambda: |-
       it.fill(id(Color::BLACK));
       it.print(0, 0, id(medium), "bb_epaper test");
       it.printf(0, 80, id(large), "T: %.1f °C", id(t_sensor).state);
       it.printf(0, 120, id(large), "H: %.1f %%", id(h_sensor).state);
