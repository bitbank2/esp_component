esphome:
  name: esphome-web-1234
  friendly_name: crowpanel29
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32s3
  framework:
    type: arduino    

# Enable logging
logger:
  level: VERBOSE

# Enable Home Assistant API
api:

# Allow Over-The-Air updates
# ota:
#  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Example configuration entry
font:
  - file: "Roboto-Black.ttf"
    id: small
    size: 16

  - file: "Roboto-Black.ttf"
    id: medium
    size: 30

  - file: "Roboto-Black.ttf"
    id: large
    size: 40

display:
  - platform: bb_epaper_iot
    update_interval: 60s
    id: test_epd
    model: EPD_CROWPANEL29
    lambda: |-
       it.fill(id(Color::BLACK));
       it.print(0, 0, id(medium), "bb_epaper test");
       it.printf(0, 80, id(medium), "one line config!");
